<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ishan Patel</title>
<meta name="description" content="Ishan Patel, industrial designer. BFA Product Design, Parsons School of Design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700&family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one green-on-cream system. Floating pill menu, giant wordmark, ruled frames, one project on stage at a time. */
:root{
  --paper:#FEF9EC;      /* page */
  --paper-2:#F4EEDC;    /* recessed bands */
  --green:#306032;      /* the one accent */
  --green-deep:#1E3A20; /* menu panel */
  --sage:#B7CFA5;       /* accent on deep green */
  --ink:#1C1F23;        /* strongest text */
  --ink-2:#55574F;      /* headings at rest, matches 70% ink on paper */
  --ink-3:#6F706A;      /* body, matches 60% ink on paper */
  --rule:rgba(48,96,50,.32);
  --coral:#E07A62;      /* "falls short" dots from the portfolio */
  --mint:#6FB384;       /* "works" dots from the portfolio */
  --sans:"Darker Grotesque","Helvetica Neue",Arial,sans-serif;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --serif-style:italic;
  --marker:#1DB322;   /* the green marker from the J-Walker sketches */
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  --wrap:1320px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink-3);font-family:var(--sans);font-weight:500;font-size:19px;line-height:1.3;letter-spacing:-.01em;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
img{max-width:100%;display:block}
a{color:inherit}
::selection{background:var(--green);color:var(--paper)}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
@media (min-width:760px){.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.4;color:var(--ink-2)}
.serif{font-family:var(--serif);font-weight:400;color:var(--green);letter-spacing:-.02em}
h1,h2,h3{font-family:var(--sans);font-weight:400;color:var(--ink-2);letter-spacing:-.022em;line-height:1;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--green);vertical-align:.05em}
.blink{animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;transition:transform .9s cubic-bezier(.76,0,.24,1)}
#loader.gone{transform:translateY(-101%)}
#loader .name{font-family:var(--sans);color:var(--green);font-size:clamp(56px,13vw,200px);line-height:.86;letter-spacing:-.04em;text-align:center}
#loader .line{display:block;overflow:hidden}
#loader .line span{display:inline-block;transform:translateY(105%);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
#loader .line:nth-child(2) span{animation-delay:.12s}
#loader .count{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:var(--gut);right:var(--gut-r);display:flex;justify-content:space-between}
#loader .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--green);width:0}
@keyframes rise{to{transform:none}}

/* ---------- pill menu ---------- */
.pill{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:color-mix(in srgb,var(--green-deep) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--paper);border-radius:28px;box-shadow:0 10px 40px -12px rgba(30,58,32,.45)}
.pill-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 8px 0 18px}
.pill button,.pill a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none}
.menu-btn{display:flex;align-items:center;gap:12px;justify-self:start;padding:8px 0}
.menu-btn .mono,.pill .mono{color:var(--paper)}
.burger{width:26px;height:10px;position:relative}
.burger i{position:absolute;left:0;right:0;height:1.5px;background:var(--sage);transition:transform .45s cubic-bezier(.76,0,.24,1),top .45s}
.burger i:first-child{top:0}.burger i:last-child{top:8.5px}
.open .burger i:first-child{top:4px;transform:rotate(18deg)}
.open .burger i:last-child{top:4px;transform:rotate(-18deg)}
.mark{font-family:var(--serif);font-size:22px;color:var(--sage);letter-spacing:-.04em;padding:6px 10px}
.say-hi{justify-self:end;display:flex;align-items:center;gap:10px;border:1px solid rgba(183,207,165,.45)!important;border-radius:999px;padding:9px 16px!important;transition:background .25s,color .25s}
.say-hi:hover{background:var(--sage);color:var(--green-deep)}
.say-hi:hover .mono{color:var(--green-deep)}
/* the drop-down: one horizontal equation bar, same voice as the ticker */
.tiles{position:fixed;z-index:49;top:calc(76px + env(safe-area-inset-top,0px));left:50%;width:min(940px,calc(100% - 32px));transform:translate(-50%,-10px);display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--green);border-radius:18px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(30,58,32,.55);clip-path:inset(0 0 100% 0 round 18px);opacity:0;pointer-events:none;transition:clip-path .55s cubic-bezier(.76,0,.24,1),transform .55s cubic-bezier(.76,0,.24,1),opacity .2s}
.tiles.open{clip-path:inset(0 0 0 0 round 18px);transform:translate(-50%,0);opacity:1;pointer-events:auto}
.tiles a,.tiles .op{font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--green);text-decoration:none;display:grid;place-items:center;padding:30px 10px}
.tiles a{font-size:14px;gap:8px;transition:background .25s,color .25s}
.tiles a+a{border-left:1px solid var(--rule)}
.tiles a small{font-size:10px;opacity:.55;letter-spacing:.12em}
.tiles a:hover,.tiles a[aria-current="page"]{background:var(--green);color:var(--paper)}
.tiles .op{font-size:16px;padding-inline:4px;opacity:.7}
.tiles a>span,.tiles .op{opacity:0;transform:translateY(-8px);transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
.tiles.open a>span,.tiles.open .op{opacity:1;transform:none}
.tiles.open>*:nth-child(2) {transition-delay:.04s}.tiles.open>*:nth-child(3) span{transition-delay:.08s}.tiles.open>*:nth-child(5) span{transition-delay:.14s}.tiles.open>*:nth-child(7) span{transition-delay:.2s}
.tiles a:last-child .dot{background:currentColor;margin-right:6px}
@media (max-width:640px){.tiles a{padding:22px 4px;font-size:12px}.say-row{flex-wrap:wrap}}
.say{grid-template-columns:1fr;width:min(560px,calc(100% - 32px))}
.say-row{display:flex;align-items:center;justify-content:center;gap:14px;padding:26px 20px}
.say-row .v{font-size:clamp(18px,2vw,22px);color:var(--ink);user-select:all;word-break:break-all}
.say .copy{border-color:var(--rule);color:var(--green)}
.say .copy:hover{background:var(--green);color:var(--paper)}

/* ---------- views ---------- */
main{min-height:100vh}
.view{animation:viewIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:.001;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- home hero ---------- */
.hero{padding-top:calc(88px + env(safe-area-inset-top,0px))}
.wordmark{display:block;font-family:var(--sans);color:var(--green);font-size:clamp(52px,8.4vw,132px);line-height:.82;letter-spacing:-.045em;margin:0 0 0 -.04em;white-space:nowrap}
.hero-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px 56px;align-items:end;padding-bottom:18px;border-bottom:1px solid var(--rule)}

.hero-meta{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:12px 24px;padding:14px 0 0}
.hero-meta .mono{font-variant-numeric:tabular-nums}.hero-meta .mono:nth-child(2){text-align:center}.hero-meta .mono:nth-child(3){text-align:right}
.statement{padding:0;justify-self:end}
.statement .h{font-family:var(--sans);text-wrap:balance;letter-spacing:-.022em;font-size:clamp(22px,2.3vw,34px);line-height:1.05;color:var(--ink-2);max-width:17ch}
.statement .h .serif{display:inline}
.statement p{font-size:19px;line-height:1.35;max-width:38ch}
.statement .more{display:inline-flex;gap:10px;align-items:center;margin-top:20px;text-decoration:none;border-bottom:1px solid var(--green);padding-bottom:4px;color:var(--green)}
.ticker{border-block:1px solid var(--rule);overflow:hidden;white-space:nowrap;padding:14px 0;background:var(--paper)}
.ticker-track{display:inline-flex;gap:56px;animation:tick 38s linear infinite;padding-left:56px}
.ticker .mono{color:var(--green);font-size:13px}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- selected works stage ---------- */
.works{padding-block:22px 40px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:22px}
.sec-head h2{font-size:clamp(28px,3.4vw,44px)}
.stage{position:relative;border:1px solid var(--rule);border-radius:4px;background:var(--paper);overflow:hidden;min-height:clamp(440px,calc(100svh - 330px),660px);display:grid;grid-template-rows:auto 1fr auto;touch-action:pan-y}
.spec{position:relative;z-index:3;width:min(400px,100%);padding:22px 22px 0}
.spec h3{font-family:var(--serif);font-style:var(--serif-style);color:var(--green);font-size:clamp(34px,4vw,52px);letter-spacing:-.03em;line-height:1;margin-bottom:26px;text-transform:uppercase}
.scrib{position:relative;display:inline-block}
.scrib svg{position:absolute;left:-6%;bottom:-.24em;width:112%;height:.42em;overflow:visible;pointer-events:none}
.scrib path{fill:none;stroke:var(--marker);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.45;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .75s .25s cubic-bezier(.6,.05,.3,1) forwards}
.scrib path+path{stroke-width:3;opacity:.25;animation-delay:.55s}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.scrib path{animation:none;stroke-dashoffset:0}}
/* type pairings to compare (preview only) */
.serif{font-style:var(--serif-style)}
.wordmark,h1,h2,.p-title{font-weight:600}
.spec dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.spec dt,.spec dd{margin:0;padding:7px 0;border-top:1px solid var(--ink-2)}
.spec dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding-top:9px;padding-right:24px}
.spec dd{text-align:right;color:var(--ink);font-size:15px}
.disc-row{position:relative;display:grid;place-items:center;min-height:300px}
.disc{grid-area:1/1;width:min(52%,560px);aspect-ratio:1.25;display:grid;place-items:center;transition:transform 1.1s cubic-bezier(.22,.61,.36,1),opacity .9s ease,filter .6s;cursor:pointer;will-change:transform}
.disc[data-pos="3"]{transform:translateX(170%) scale(.2);opacity:0;pointer-events:none}
.disc[data-pos="-3"]{transform:translateX(-170%) scale(.2);opacity:0;pointer-events:none}
.disc img{max-height:min(34vw,calc(100svh - 560px),380px);min-height:160px;width:auto;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(28,31,35,.18));animation:float 7s ease-in-out infinite}
.disc[data-pos="0"]{transform:none;z-index:2}
.disc[data-pos="-1"]{transform:translateX(-80%) scale(.28) rotate(-10deg);opacity:.85;z-index:1}
.disc[data-pos="1"]{transform:translateX(80%) scale(.28) rotate(10deg);opacity:.85;z-index:1}
.disc[data-pos="-2"]{transform:translateX(-130%) scale(.3);opacity:0;pointer-events:none}
.disc[data-pos="2"]{transform:translateX(130%) scale(.3);opacity:0;pointer-events:none}
.disc:nth-child(2) img{animation-delay:-2s}.disc:nth-child(3) img{animation-delay:-4s}.disc:nth-child(4) img{animation-delay:-5.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.facts{position:relative;z-index:3;display:grid;grid-template-columns:1fr;gap:20px 48px;padding:0 22px 96px;max-width:860px;margin:0 auto;width:100%;text-align:center}
.fact .num{font-family:var(--serif);color:var(--green);font-size:clamp(34px,4vw,52px);line-height:1}
.fact .mono{display:block;margin-bottom:8px;font-size:10.5px;letter-spacing:.14em}
.fact p{font-size:15px;line-height:1.3;max-width:30ch;margin:6px auto 0;color:var(--ink-2)}
.fact.line p{font-family:var(--serif);color:var(--green);font-size:clamp(20px,2.1vw,26px);line-height:1.15;max-width:22ch;text-transform:uppercase;letter-spacing:-.02em}
.dock{position:absolute;z-index:4;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:5px;box-shadow:0 8px 24px -14px rgba(30,58,32,.5)}
.dock button,.dock a{font:inherit;background:none;border:0;cursor:pointer;color:var(--ink);text-decoration:none;border-radius:999px;padding:9px 14px;display:flex;align-items:center;gap:8px}
.dock button:hover{background:var(--paper-2)}
.dock .count{white-space:nowrap;font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:0 8px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.dock a{background:var(--green);color:var(--paper);padding:9px 18px}
.dock a:hover{background:var(--green-deep)}
.swap{transition:opacity .35s,transform .35s}
.swap.out{opacity:0;transform:translateY(8px)}

/* selected works: a horizontal strip you scroll through */
.track{position:absolute;inset:0 0 44px 0;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scroll-snap-type:none;scrollbar-width:none;-ms-overflow-style:none;--iw:34cqw;padding-inline:calc(50cqw - var(--iw) / 2);cursor:grab;overscroll-behavior-x:contain;user-select:none}
#stage{container-type:inline-size}
.track::-webkit-scrollbar{display:none}
.track.snap{scroll-snap-type:x mandatory}
.track.grabbing{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.slide{flex:0 0 var(--iw);height:100%;display:grid;place-items:center;scroll-snap-align:center;cursor:pointer}
.slide .in{display:grid;place-items:center;width:100%;height:100%;will-change:transform,opacity}
.slide img{max-width:88%;max-height:calc(clamp(360px,calc(100svh - 360px),640px) - 150px);width:auto;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(28,31,35,.18));pointer-events:none;-webkit-user-drag:none}
@media (max-width:640px){.track{position:relative;inset:auto;height:250px;--iw:64cqw}.slide img{max-height:200px}}

/* ---------- index list ---------- */
.index{padding-block:56px 120px}
.rows{border-top:1px solid var(--ink-2)}
.row{display:grid;grid-template-columns:56px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 80px;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink-2);transition:color .2s,padding .35s cubic-bezier(.2,.8,.2,1)}
.row .t{font-size:clamp(24px,2.6vw,34px);color:var(--ink-2);transition:color .2s}
.row:hover{padding-left:14px}
.row:hover .t{color:var(--green)}
.row .mono{font-size:11px}
.row .yr{text-align:right;font-variant-numeric:tabular-nums}
.peek{position:fixed;z-index:40;left:0;top:0;width:240px;aspect-ratio:4/3;pointer-events:none;border-radius:4px;overflow:hidden;opacity:0;transform:translate(-50%,-50%) scale(.85) rotate(-4deg);transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1);background:var(--paper-2)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
.peek img{width:100%;height:100%;object-fit:cover}

/* ---------- footer ---------- */
footer{background:var(--green);color:var(--paper);padding-block:72px calc(28px + env(safe-area-inset-bottom,0px))}
footer .mono{color:var(--sage)}
.foot-top{display:block}
.foot-top h2{color:var(--paper);font-size:clamp(40px,6vw,88px)}
.foot-top h2 .serif{color:var(--sage)}
.contact-lines{display:grid;gap:14px}
.contact-lines .v{font-size:clamp(20px,2vw,26px);color:var(--paper);user-select:all;word-break:break-word}
.copy{font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:none;border:1px solid rgba(183,207,165,.5);color:var(--sage);border-radius:999px;padding:6px 12px;cursor:pointer;margin-left:10px;vertical-align:middle}
.copy:hover{background:var(--sage);color:var(--green-deep)}
.foot-word{display:inline-block;font-family:var(--sans);font-size:17.4vw;line-height:.78;letter-spacing:-.045em;color:var(--paper);opacity:.12;margin:56px 0 24px -.04em;white-space:nowrap;user-select:none}

.foot-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- project page ---------- */
.p-head{padding-top:calc(116px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px 64px;align-items:end;padding-bottom:40px}
.crumb{display:inline-flex;gap:10px;margin-bottom:22px;text-decoration:none}
.crumb:hover{color:var(--green)}
.p-title{font-size:clamp(64px,11vw,168px);color:var(--green);letter-spacing:-.045em;line-height:.85}
.p-lede{font-size:clamp(20px,2vw,26px);line-height:1.2;color:var(--ink-2);margin-top:22px;max-width:28ch}
.p-head .spec{padding:0;width:100%}
.frame{border:1px solid var(--rule);border-radius:4px;padding:10px;background:var(--paper)}
.frame img{width:100%;border-radius:2px}
.frame figcaption{display:flex;justify-content:space-between;gap:12px;padding:10px 2px 0}
figure{margin:0}
.p-hero img{aspect-ratio:2.2;object-fit:cover}
.p-hero img.pos-r{object-position:78% 50%}
.swatch{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:18px 20px 22px;background:color-mix(in srgb,var(--sw) 9%,var(--paper-2));transition:background-color .5s}
.sw-top{display:flex;justify-content:space-between;gap:12px}
.sw-name{color:var(--ink)}
.sw-stage{display:grid;place-items:center;aspect-ratio:2.6;position:relative}
.p-hero .sw-stage img{position:relative;z-index:1;width:min(54%,540px);height:auto;aspect-ratio:auto;object-fit:contain;filter:drop-shadow(0 26px 22px rgba(28,31,35,.2));transition:opacity .16s,transform .3s cubic-bezier(.2,.8,.2,1)}
.sw-stage img.out{opacity:0;transform:translateY(6px) scale(.98)}
.sw-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.sw-dots button{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);background:var(--c);box-shadow:0 0 0 1px var(--rule);cursor:pointer;padding:0;transition:transform .2s,box-shadow .2s}
.sw-dots button:hover{transform:scale(1.12)}
.sw-dots button[aria-checked="true"]{box-shadow:0 0 0 2px var(--green);transform:scale(1.12)}
.sw-dots button:focus-visible{outline:2px solid var(--green);outline-offset:3px}
@media (max-width:700px){.sw-stage{aspect-ratio:1.5}.p-hero .sw-stage img{width:86%}.sw-dots{gap:9px}.sw-dots button{width:24px;height:24px}.grid.trio{--cols:3!important;gap:8px}.grid.trio .frame{padding:6px}.grid.trio figcaption .mono{font-size:9px}}
.block{padding-block:72px;border-top:1px solid var(--rule);display:grid;gap:24px}
.block:first-of-type{border-top:0}
.lbl-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px 56px;align-items:baseline;margin-bottom:12px}
.lbl-row h2{font-size:clamp(32px,4vw,56px);color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:1px solid var(--ink-2)}
.stat{padding:22px 24px 24px 0;border-bottom:1px solid var(--rule)}
.stat .n{font-family:var(--serif);color:var(--green);font-size:clamp(46px,5vw,72px);line-height:1;letter-spacing:-.03em}
.stat p{font-size:17px;color:var(--ink);margin-top:10px;max-width:24ch}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.cmp .frame{display:grid;grid-template-rows:240px auto;gap:14px}
.cmp .frame img{height:240px;width:100%;object-fit:contain}
.cmp ul{list-style:none;margin:0;padding:0 4px 6px;display:grid;gap:8px}
.cmp li{display:grid;grid-template-columns:14px 1fr;gap:10px;color:var(--ink);font-size:16px;line-height:1.25}
.cmp li::before{content:"";width:12px;height:12px;border-radius:50%;margin-top:3px;background:var(--mint)}

function route(){
  let h=(location.hash||'#home').slice(1);
  if(h==='contact'){ if(!app.innerHTML) render('home'); history.replaceState(null,'',location.pathname+location.search+'#'+(app.dataset.view||'home')); setTimeout(()=>openPanel('say'),0); return; }
  if(h==='selected'){ if(!app.querySelector('#stage')) render('work'); closeMenu(); document.getElementById('selected').scrollIntoView({behavior:'smooth'}); return; }
  if(h==='found-out'){h='explorations';history.replaceState(null,'','#explorations')}
  if(!ROUTES[h]) h='home';
  render(h); window.scrollTo(0,0); closeMenu();
}
function render(h){
  app.innerHTML=ROUTES[h]();app.dataset.view=h;
  document.querySelectorAll('.tiles a').forEach(a=>a.toggleAttribute('aria-current',a.getAttribute('href')==='#'+(PROJECTS.some(p=>p.id===h)?'work':h)));
  document.title=h==='home'?'Ishan Patel':(PROJECTS.find(p=>p.id===h)?.name||(h==='explorations'?LAB:h[0].toUpperCase()+h.slice(1)))+' · Ishan Patel';
  document.querySelectorAll('.js-lab').forEach(e=>e.textContent=LAB);
  if(h==='home')initStage();
  if(h==='explorations'){initCycle();initDrag();initFlip();}
  if(h==='sonic-snap')initSwatch();
  const bs=document.querySelector('.bars');if(bs){const io=new IntersectionObserver(e=>{if(e[0].isIntersecting){bs.classList.add('in');io.disconnect()}},{threshold:.3});io.observe(bs)}
  tickTime();fit();
}
addEventListener('hashchange',route);

/* ---------- menu ---------- */
const pill=document.getElementById('pill'),mb=document.getElementById('menu-btn'),tiles=document.getElementById('tiles'),say=document.getElementById('say'),sb=document.getElementById('say-btn');
function closeMenu(){pill.classList.remove('open');tiles.classList.remove('open');say.classList.remove('open');mb.setAttribute('aria-expanded','false');sb.setAttribute('aria-expanded','false')}
function openPanel(which){const el=which==='say'?say:tiles,btn=which==='say'?sb:mb,o=!el.classList.contains('open');closeMenu();if(o){el.classList.add('open');btn.setAttribute('aria-expanded','true');if(which==='menu')pill.classList.add('open')}}
mb.addEventListener('click',()=>openPanel('menu'));
sb.addEventListener('click',()=>openPanel('say'));
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
document.addEventListener('click',e=>{if(!pill.contains(e.target)&&!tiles.contains(e.target)&&!say.contains(e.target))closeMenu()});

/* ---------- stage ---------- */
function initStage(){
  const stage=document.getElementById('stage');if(!stage)return;
  const track=document.getElementById('track'),slides=[...track.children],spec=document.getElementById('spec'),facts=document.getElementById('facts'),open=document.getElementById('open');
  const N=PROJECTS.length;let cur=-1,curSlide=N,raf=0,idle=0,jumping=false;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const W=()=>slides[0].offsetWidth;
  const leftFor=k=>slides[k].offsetLeft-(track.clientWidth-slides[k].offsetWidth)/2;
  function show(i){if(i===cur)return;const first=cur<0;cur=i;const p=PROJECTS[i];open.href='#'+p.id;
    const swap=()=>{spec.innerHTML=specHTML(p);facts.innerHTML=factsHTML(p);spec.classList.remove('out');facts.classList.remove('out')};
    if(first)swap();else{spec.classList.add('out');facts.classList.add('out');clearTimeout(show.t);show.t=setTimeout(swap,220)}}
  function paint(){raf=0;const tr=track.getBoundingClientRect(),c=tr.left+tr.width/2;let best=0,bd=1e9;
    slides.forEach((s,k)=>{const r=s.getBoundingClientRect(),d=(r.left+r.width/2-c)/r.width,a=Math.abs(d);
      if(a<bd){bd=a;best=k}
      if(a>3){s.firstChild.style.opacity=0;return}
      const sc=1-Math.min(a,1.6)*0.42,rot=reduce?0:Math.max(-1.6,Math.min(1.6,d))*9,op=1-Math.min(a,2)*0.32;
      s.firstChild.style.transform=`translateY(${Math.min(a,1.6)*14}px) scale(${sc}) rotate(${rot}deg)`;s.firstChild.style.opacity=op});
    if(best!==curSlide){curSlide=best;slides.forEach((s,k)=>s.setAttribute('aria-hidden',k!==best));clearTimeout(paint.t);paint.t=setTimeout(()=>show(curSlide%N),cur<0?0:160)}}
  /* keep the strip endless: when it settles in the first or last copy, jump silently to the same spot in the middle copy */
  let touching=false;
  function recenter(){if(drag||touching)return;const set=W()*N,l=track.scrollLeft,mid=leftFor(N);
    let nl=l;if(l<mid-set*0.5)nl=l+set;else if(l>mid+set*1.5)nl=l-set;
    if(Math.abs(nl-l)>1){if(coarse)track.style.scrollSnapType='none';track.scrollLeft=nl;paint();if(coarse)requestAnimationFrame(()=>{track.style.scrollSnapType=''})}}
  const hasEnd='onscrollend' in window;
  const req=()=>{if(!raf)raf=requestAnimationFrame(paint);if(!hasEnd){clearTimeout(idle);idle=setTimeout(()=>settle(),220)}};
  track.addEventListener('scroll',req,{passive:true});
  const coarse=matchMedia('(pointer:coarse)').matches;if(coarse)track.classList.add('snap');
  /* on desktop we settle ourselves: glide to the nearest slide once scrolling stops, then loop silently */
  function settle(){if(drag||touching)return;if(!coarse){const t=leftFor(curSlide);if(Math.abs(track.scrollLeft-t)>2){track.scrollTo({left:t,behavior:'smooth'});return}}recenter()}
  if(hasEnd)track.addEventListener('scrollend',()=>{clearTimeout(idle);idle=setTimeout(settle,40)});
  track.addEventListener('touchstart',()=>{touching=true;clearTimeout(idle)},{passive:true});
  track.addEventListener('touchend',()=>{touching=false;if(!hasEnd){clearTimeout(idle);idle=setTimeout(()=>settle(),320)}},{passive:true});addEventListener('resize',()=>{track.scrollLeft=leftFor(curSlide);req()});
  const goTo=k=>{track.scrollTo({left:leftFor(Math.max(0,Math.min(slides.length-1,k))),behavior:reduce?'auto':'smooth'})};
  document.getElementById('prev').onclick=()=>goTo(curSlide-1);
  document.getElementById('next').onclick=()=>goTo(curSlide+1);
  stage.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){goTo(curSlide+1);e.preventDefault()}if(e.key==='ArrowLeft'){goTo(curSlide-1);e.preventDefault()}});
  let drag=null,moved=false;
  track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,l:track.scrollLeft,t:performance.now(),v:0};moved=false;track.classList.add('grabbing');track.setPointerCapture(e.pointerId)});
  track.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>4)moved=true;const now=performance.now(),nl=drag.l-dx;drag.v=(nl-track.scrollLeft)/Math.max(1,now-drag.t);drag.t=now;track.scrollLeft=nl});
  const end=()=>{if(!drag)return;const v=drag.v;drag=null;track.classList.remove('grabbing');
    const proj=track.scrollLeft+v*220;goTo(Math.round((proj-leftFor(0))/W()))};
  track.addEventListener('pointerup',end);track.addEventListener('pointercancel',end);
  slides.forEach((s,k)=>s.addEventListener('click',()=>{if(moved){moved=false;return}if(k===curSlide)location.hash=PROJECTS[k%N].id;else goTo(k)}));
  track.style.scrollSnapType='none';track.scrollLeft=leftFor(N);requestAnimationFrame(()=>{track.style.scrollSnapType=''});
  paint();show(curSlide%N);
}

/* ---------- sonic snap: colorway picker ---------- */
function initSwatch(){const f=document.getElementById('swatch');if(!f)return;const im=f.querySelector('.sw-stage img'),nm=f.querySelector('.sw-name'),bs=[...f.querySelectorAll('.sw-dots button')];let tok=0;
  SS_COLORS.forEach(([k])=>{const i=new Image();i.src=A+'ss-front-'+k+'.webp'});
  const pick=b=>{if(b.getAttribute('aria-checked')==='true')return;const t=++tok;bs.forEach(x=>x.setAttribute('aria-checked',x===b));f.style.setProperty('--sw',b.style.getPropertyValue('--c'));nm.textContent=b.dataset.n;
    const n=new Image();n.src=A+'ss-front-'+b.dataset.k+'.webp';im.classList.add('out');Promise.all([n.decode().catch(()=>{}),new Promise(r=>setTimeout(r,160))]).then(()=>{if(t!==tok)return;im.src=n.src;im.classList.remove('out')})};
  bs.forEach((b,i)=>{b.addEventListener('click',()=>pick(b));b.addEventListener('keydown',e=>{const d=e.key==='ArrowRight'||e.key==='ArrowDown'?1:e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:0;if(!d)return;e.preventDefault();const nb=bs[(i+d+bs.length)%bs.length];nb.focus();pick(nb)})});}

/* ---------- explorations: flip through the vitra sketches ---------- */
function initFlip(){const c=document.getElementById('vl-flip');if(!c)return;const im=c.querySelector('img'),lab=c.querySelector('.flip-n'),n=+c.dataset.n;let k=1,t=null;
  for(let i=2;i<=n;i++){const p=new Image();p.src=A+'vl-sk-'+i+'.webp'}
  const go=()=>{k=k%n+1;const u=A+'vl-sk-'+k+'.webp',nx=new Image();nx.src=u;(nx.decode?nx.decode():Promise.resolve()).then(()=>{im.src=u;lab.textContent=k+' / '+n},()=>{im.src=u})};
  /* flips on its own while on screen; hovering speeds it up */
  const run=ms=>{clearInterval(t);t=setInterval(go,ms)};
  {let seen=false;
    new IntersectionObserver(e=>{seen=e[0].isIntersecting;if(seen)run(800);else clearInterval(t)},{threshold:.2}).observe(c);
    c.addEventListener('mouseenter',()=>run(380));c.addEventListener('mouseleave',()=>seen?run(800):clearInterval(t));}
  c.addEventListener('click',()=>{if(c.dataset.moved==='1')return;go()});}

/* ---------- lamps: swap colorway and light up the section ---------- */
const GLOW={spire:'rgba(150,200,120,.42)',lune:'rgba(255,170,70,.5)',orbit:'rgba(255,236,190,.55)',halo:'rgba(255,190,120,.45)',lucetta:'rgba(255,175,90,.5)',nova:'rgba(255,214,120,.5)'};
function initCycle(){const set=document.getElementById('lamps');document.querySelectorAll('.cycle').forEach(c=>{const im=c.querySelector('img'),id=c.dataset.cycle;let k=1,t=null;
  const go=()=>{k=k%3+1;const u=A+'vl-'+id+'-'+k+'.webp',nx=new Image();nx.src=u;(nx.decode?nx.decode():Promise.resolve()).then(()=>{im.src=u},()=>{im.src=u})};
  im.loading='eager';
  const on=()=>{const r=c.getBoundingClientRect(),R=set.getBoundingClientRect();set.style.setProperty('--gx',(r.left+r.width/2-R.left)+'px');set.style.setProperty('--gy',(r.top+r.height/2-R.top)+'px');set.style.setProperty('--glow',GLOW[id]);c.style.setProperty('--glow',GLOW[id]);set.classList.add('lit');c.classList.add('on')};
  const off=()=>{set.classList.remove('lit');c.classList.remove('on')};
  c.addEventListener('mouseenter',()=>{on();go();t=setInterval(go,900)});c.addEventListener('mouseleave',()=>{clearInterval(t);off()});
  c.addEventListener('click',()=>{if(c.dataset.moved==='1')return;go();on();clearTimeout(c._t);c._t=setTimeout(off,1600)});
  [2,3].forEach(n=>{const p=new Image();p.src=A+'vl-'+id+'-'+n+'.webp'})})}

/* ---------- Explorations: drag cards around (mouse and trackpad only, so phones still scroll) ---------- */
function initDrag(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  document.querySelectorAll('.scatter').forEach(sc=>sc.classList.add('can-drag'));
  let z=10;
  document.querySelectorAll('.scatter .card').forEach(c=>{
    c.addEventListener('pointerdown',e=>{
      if(e.button!==0)return;
      const sx=e.clientX,sy=e.clientY,ox=parseFloat(c.style.getPropertyValue('--dx'))||0,oy=parseFloat(c.style.getPropertyValue('--dy'))||0;let moved=false;
      c.setPointerCapture(e.pointerId);c.dataset.moved='0';
      const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)>4){moved=true;c.classList.add('dragging');c.style.zIndex=++z}
        if(moved){c.style.setProperty('--dx',ox+dx+'px');c.style.setProperty('--dy',oy+dy+'px')}};
      const up=()=>{c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.classList.remove('dragging');c.dataset.moved=moved?'1':'0';setTimeout(()=>c.dataset.moved='0',50)};
      c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);
    });
  });
}

/* ---------- easter egg: type "fafo" anywhere ---------- */
let keys='';
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  keys=(keys+(e.key||'').toLowerCase()).slice(-4);
  if(keys!=='fafo')return;
  keys='';
  const go=()=>{const cards=document.querySelectorAll('.scatter .card');cards.forEach((c,i)=>{c.style.transition='transform .9s cubic-bezier(.2,.8,.2,1)';c.style.setProperty('--dx',(Math.random()*240-120)+'px');c.style.setProperty('--dy',(Math.random()*160-80)+'px');c.style.setProperty('--r',(Math.random()*40-20)+'deg');setTimeout(()=>c.style.transition='',950)});
    const t=document.getElementById('toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
  if(app.dataset.view!=='explorations'){location.hash='explorations';setTimeout(go,700)}else go();
});

/* ---------- index hover peek ---------- */
function initPeek(){
  if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  const pk=document.getElementById('peek'),pi=document.getElementById('peek-img');
  document.querySelectorAll('.row').forEach(r=>{
    r.addEventListener('mouseenter',()=>{pi.src=A+r.dataset.peek+'.webp';pk.classList.add('on')});
    r.addEventListener('mouseleave',()=>pk.classList.remove('on'));
    r.addEventListener('mousemove',e=>{pk.style.left=e.clientX+'px';pk.style.top=e.clientY+'px'});
  });
}

/* ---------- time + copy ---------- */
function fit(){document.querySelectorAll('.foot-word').forEach(el=>{const par=el.parentElement,cs=getComputedStyle(par),w=par.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);el.style.fontSize='100px';const r=w/el.getBoundingClientRect().width;el.style.fontSize=(100*r*0.995)+'px'})}
addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(fit);
function tickTime(){const f=z=>new Intl.DateTimeFormat('en-US',{timeZone:z,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date());const t=f('America/New_York'),a=f('Asia/Kolkata');document.querySelectorAll('.js-time').forEach(e=>e.textContent=t);document.querySelectorAll('.js-amd').forEach(e=>e.textContent=a)}
setInterval(tickTime,15000);
document.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',()=>{
  const el=document.getElementById(b.dataset.copy),t=el.textContent;
  const done=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1600)};
  try{navigator.clipboard.writeText(t).then(done,()=>{sel(el);b.textContent='Selected'})}catch(e){sel(el);b.textContent='Selected'}
}));
function sel(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

/* ---------- loader ---------- */
(function(){
  const L=document.getElementById('loader'),n=document.getElementById('ld-n'),bar=document.getElementById('ld-bar');
  let seen=false;try{seen=sessionStorage.getItem('ip-loaded')==='1'}catch(e){}
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(seen||reduce){L.remove();return}
  const LINES=['Cutting cardboard mockups','Hot-gluing the cardboard back together','Rebuilding the CAD model, again','Fixing a fillet that will not fillet','Waiting on a 3D print','Peeling supports off a print','Sanding the joints','Measuring twice, cutting once','Rendering, 3 hours left','Moving one light in KeyShot','Reading one more study','Interviewing anyone who will listen'];
  const pick=[...LINES].sort(()=>Math.random()-.5).slice(0,3),msg=document.getElementById('ld-msg');msg.textContent=pick[0]+'...';
  const t0=performance.now(),D=2100;
  (function f(t){const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);const m=pick[Math.min(2,Math.floor(k*3))]+'...';if(msg.textContent!==m)msg.textContent=m;n.textContent=String(Math.round(e*100)).padStart(3,'0');bar.style.width=e*100+'%';if(k<1)requestAnimationFrame(f);else{L.classList.add('gone');setTimeout(()=>L.remove(),1000);try{sessionStorage.setItem('ip-loaded','1')}catch(e){}}})(t0);
})();


route();
</script>
